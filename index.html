<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timothy Francis</title>
<meta name="description" content="Operations and data systems. Whitefish, Montana.">
<meta name="color-scheme" content="light">
<link rel="canonical" href="https://timothy-francis.com/">
<style>
  :root {
    --paper:  #c9ccc4;   /* single stone tone — no light/dark switching */
    --ink:    #1b2620;
    --soft:   #4c5852;
    --link:         #0000ee;
    --link-visited: #551a8b;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 8vh 6vw;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.55;
  }

  .layout {
    display: grid;
    grid-template-columns: 19rem 1fr;
    column-gap: 3.5rem;
    max-width: 50rem;
    width: 100%;
  }

  .portrait {
    grid-column: 1;
    grid-row: 1;
    width: 100%;
    aspect-ratio: 8 / 9;
    object-fit: cover;
    display: block;
    background: rgba(0, 0, 0, 0.08);
  }

  .intro { grid-column: 2; grid-row: 1; }

  h1 {
    font-size: clamp(2.3rem, 5.5vw, 3.3rem);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1;
    margin: -0.12em 0 1.6rem;
  }

  .intro p { margin: 0 0 1rem; max-width: 26rem; }
  .intro p:last-child { margin-bottom: 0; }
  .intro a { color: var(--ink); text-underline-offset: 2px; }

  .links {
    grid-column: 2;
    grid-row: 2;
    margin-top: 3.5rem;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.3rem;
  }
  .links a { color: var(--link); }
  .links a:visited { color: var(--link-visited); }
  .links a:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; }

  @media (max-width: 46rem) {
    body { display: block; padding: 7vh 8vw 14vh; }
    .layout { display: block; max-width: 30rem; margin: 0 auto; }
    .portrait { max-width: 15rem; margin-bottom: 2rem; }
    h1 { margin-bottom: 1.25rem; }
    .links { margin-top: 2.75rem; }
  }
</style>
</head>
<body>

  <div class="layout">

    <!-- PHOTO: save your picture in the repo as photo.jpg. Any dimensions work;
         it gets cropped to this box automatically. -->
    <img class="portrait" src="photo.jpg" alt="Timothy Francis">

    <div class="intro">
      <h1>Timothy Francis</h1>

      <!-- BIO: replace with your own. Two short paragraphs is about right. -->
      <p>Current: Ops guy at Forecasting Research Institute.</p>

      <p>Former: undercover investigator on factory farms and wildland firefighter.</p>
    </div>

    <!-- LINKS: add or delete rows freely. -->
    <nav class="links">
      <a href="cv.pdf">cv</a>
      <a href="about.html">about</a>
      <a href="https://example.com/blog">blog</a>
      <a href="photos.html">photos</a>
      <a href="mailto:you@timothy-francis.com">email</a>
    </nav>

  </div>

</body>
</html>
